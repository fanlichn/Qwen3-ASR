# Install as /etc/nginx/sites-available/asr.lakdriya.com.conf on Ubuntu.
# Cloudflare provides visitor TLS; the origin serves HTTP on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name asr.lakdriya.com;
    server_tokens off;

    # The API allows a 25 MiB file plus multipart overhead.
    client_max_body_size 26m;
    client_body_timeout 120s;

    # Do not record request paths or credentials in an access log.
    access_log off;
    error_log /var/log/nginx/asr-error.log warn;

    add_header Cache-Control "no-store" always;

    location / {
        # Preserve /v1/audio/transcriptions and all other API paths.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
    }
}
